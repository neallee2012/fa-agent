# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.32.0'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: fa-shared-context-poc
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://cog-fasample-memory-demo.services.ai.azure.com/api/projects/faexample
    fa-context-a:
        project: src/fa-context-a
        host: azure.ai.agent
        language: docker
        image: crfacontextpocdemo.azurecr.io/fa-behavior-assistant@sha256:3631893065b76c637d4744d420f246dbd1d98a72084310967f03ab4d3b459cbd
        docker:
            imagePassthrough: true
            remoteBuild: false
        uses:
            - ai-project
        env:
            PYTHONUTF8: "1"
            BEHAVIOR_HOSTED_ENABLED: "true"
            BEHAVIOR_ASSISTANT_PROFILE: "assistant-v1.2"
            BEHAVIOR_ASSISTANT_RUNTIME_PATH: /opt/copilot/1.0.83/prebuilds/linux-x64/copilot-runtime
            BEHAVIOR_API_URL: https://ca-fa-behavior-poc.example-00000002.westus3.azurecontainerapps.io
            BEHAVIOR_API_AUDIENCE: ${CONTEXT_API_AUDIENCE}
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        description: Bounded SDK assistant with nullable OpenAI stream filtering, durable authorization and explicit finish.
        kind: hosted
        name: fa-context-a
        protocols:
            - protocol: invocations
              version: 2.0.0
        sessionConfiguration:
            idleTimeoutSeconds: 300
    fa-context-b:
        project: src/fa-context-b
        host: azure.ai.agent
        language: docker
        image: crfacontextpocdemo.azurecr.io/fa-behavior-hosted@sha256:a7108868f0c8ab00b6d0b2e640e190873cc4977244b6be793c33240cb5c5a6cf
        docker:
            imagePassthrough: true
            remoteBuild: false
        uses:
            - ai-project
        env:
            PYTHONUTF8: "1"
            BEHAVIOR_HOSTED_ENABLED: "true"
            BEHAVIOR_API_URL: https://ca-fa-behavior-poc.example-00000002.westus3.azurecontainerapps.io
            BEHAVIOR_API_AUDIENCE: ${CONTEXT_API_AUDIENCE}
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        description: Constrained behavior executor with one-use launch permits and verified checkpoint recovery.
        kind: hosted
        name: fa-context-b
        protocols:
            - protocol: invocations
              version: 2.0.0
        sessionConfiguration:
            idleTimeoutSeconds: 300
    fa-context-c:
        project: src/fa-context-c
        host: azure.ai.agent
        language: docker
        image: crfacontextpocdemo.azurecr.io/fa-behavior-hosted@sha256:a7108868f0c8ab00b6d0b2e640e190873cc4977244b6be793c33240cb5c5a6cf
        docker:
            imagePassthrough: true
            remoteBuild: false
        uses:
            - ai-project
        env:
            PYTHONUTF8: "1"
            BEHAVIOR_HOSTED_ENABLED: "true"
            BEHAVIOR_API_URL: https://ca-fa-behavior-poc.example-00000002.westus3.azurecontainerapps.io
            BEHAVIOR_API_AUDIENCE: ${CONTEXT_API_AUDIENCE}
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        description: Constrained behavior executor for verified four-agent capacity.
        kind: hosted
        name: fa-context-c
        protocols:
            - protocol: invocations
              version: 2.0.0
        sessionConfiguration:
            idleTimeoutSeconds: 300
    fa-context-d:
        project: src/fa-context-d
        host: azure.ai.agent
        language: docker
        image: crfacontextpocdemo.azurecr.io/fa-behavior-hosted@sha256:a7108868f0c8ab00b6d0b2e640e190873cc4977244b6be793c33240cb5c5a6cf
        docker:
            imagePassthrough: true
            remoteBuild: false
        uses:
            - ai-project
        env:
            PYTHONUTF8: "1"
            BEHAVIOR_HOSTED_ENABLED: "true"
            BEHAVIOR_API_URL: https://ca-fa-behavior-poc.example-00000002.westus3.azurecontainerapps.io
            BEHAVIOR_API_AUDIENCE: ${CONTEXT_API_AUDIENCE}
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        description: Constrained behavior executor for verified four-agent capacity.
        kind: hosted
        name: fa-context-d
        protocols:
            - protocol: invocations
              version: 2.0.0
        sessionConfiguration:
            idleTimeoutSeconds: 300
infra:
    provider: microsoft.foundry
